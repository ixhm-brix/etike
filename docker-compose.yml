# Local development: nginx + api + db.
# Works from a fresh clone with no .env file; the defaults below are for
# local use only. Override any of them by creating a .env file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etike_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-etike}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # Flask's dev server with auto-reload; production uses Gunicorn instead.
    command: flask --app wsgi run --debug --host 0.0.0.0 --port 8000
    environment:
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-jwt-secret-not-for-production}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-15}
      # Flutterwave test keys and Africa's Talking sandbox keys, if you have
      # them in .env. Without them payments return 503 and SMS is skipped.
      FLW_SECRET_KEY: ${FLW_SECRET_KEY:-}
      FLW_SECRET_HASH: ${FLW_SECRET_HASH:-}
      FLW_REDIRECT_URL: ${FLW_REDIRECT_URL:-http://localhost/payment.html}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-etike}:${POSTGRES_PASSWORD:-etike_dev_password}@db:5432/${POSTGRES_DB:-etike}
    volumes:
      - ./backend:/app
      # So data/scripts can be run inside the container (see data/README.md).
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  db_data:
