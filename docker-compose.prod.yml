# Production / staging on the VPS. Reads secrets from the .env file on the
# server (see .env.example). Run with:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    # Uses the Dockerfile's default command: Gunicorn, FLASK_ENV=production,
    # so debug mode is always off.
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      FEATURE_BUS_BOOKING: ${FEATURE_BUS_BOOKING:-false}
      # Logs in to TEST accounts without a password: keep off on a public server.
      DEMO_LOGIN: ${DEMO_LOGIN:-false}
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-15}
      CANCEL_CUTOFF_HOURS: ${CANCEL_CUTOFF_HOURS:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Payments and SMS: optional. Without them the API says payments are
      # unavailable (503) and skips SMS.
      MOMO_BASE_URL: ${MOMO_BASE_URL:-}
      MOMO_TARGET_ENVIRONMENT: ${MOMO_TARGET_ENVIRONMENT:-}
      MOMO_SUBSCRIPTION_KEY: ${MOMO_SUBSCRIPTION_KEY:-}
      MOMO_API_USER: ${MOMO_API_USER:-}
      MOMO_API_KEY: ${MOMO_API_KEY:-}
      MOMO_CALLBACK_URL: ${MOMO_CALLBACK_URL:-}
      MOMO_CURRENCY: ${MOMO_CURRENCY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
    volumes:
      # Car photos drivers upload; Nginx serves the same volume. Back it up
      # with the database (see docs/deployment.md).
      - uploads:/uploads
      # Drivers' legal documents: personal data. Only the API mounts this
      # volume; Nginx never serves it.
      - documents:/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # HTTP until the certificate exists. For HTTPS set NGINX_CONF=https.conf
      # in .env (see docs/deployment.md, "Turn on HTTPS"); this file stays
      # unchanged, so `git pull` deploys keep working.
      - ./nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - uploads:/var/www/uploads:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  uploads:
  documents:
