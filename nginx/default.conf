# Login and sign-up: at most 10 requests a minute per IP address (with a
# short burst allowed), to slow down password guessing. Over the limit
# gets HTTP 429.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. External sources: Google Fonts and the OSRM road router.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://router.project-osrm.org; frame-ancestors 'none'" always;
    server_tokens off;
    client_max_body_size 64k;

    # Used by Let's Encrypt to prove we own the domain.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Same as /api/ below, plus the rate limit for login and sign-up.
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API requests go to Flask (service name "api" in Docker Compose).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the static frontend.
    location / {
        # Pages change with every deploy: browsers must check for a new
        # version each time. ("expires" keeps the security headers above.)
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # CSS and JS change with every deploy: browsers keep a copy but check
    # for a newer one each time (a quick 304 when nothing changed).
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        # add_header in a location drops the server-level ones, so repeat them.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(svg|png|jpg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
